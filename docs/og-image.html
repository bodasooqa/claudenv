<!doctype html>
<!-- Source for og-image.png (1200x630). Re-render with a headless browser screenshot at that viewport. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px; height: 630px; box-sizing: border-box;
      background: #0a0a0a; color: #e5e5e5;
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      padding: 80px 96px;
      display: flex; flex-direction: column; justify-content: space-between;
      background-image: radial-gradient(circle at 100% 0%, rgba(255,122,89,0.14), transparent 55%);
    }
    .wordmark { font-size: 112px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1; }
    .wordmark span { color: #ff7a59; }
    .tagline { font-size: 40px; margin: 36px 0 0; line-height: 1.3; }
    .tagline em { font-style: normal; color: #ff7a59; }
    .term {
      background: #161616; border: 1px solid #262626; border-radius: 12px;
      padding: 28px 32px; font-size: 26px; line-height: 1.6; color: #8a8a8a;
    }
    .term .p { color: #ff7a59; }
    .term .c { color: #e5e5e5; }
    .term .ok { color: #5fff7f; }
  </style>
</head>
<body>
  <div>
    <h1 class="wordmark"><span>&gt;_</span> claudenv</h1>
    <p class="tagline">nvm-style account manager for <em>Claude Code</em></p>
  </div>
  <div class="term">
    <div><span class="p">$</span> <span class="c">claudenv local work</span></div>
    <div>Wrote ~/work/acme/.claudenvrc <span class="ok">→</span> <span class="c">work</span></div>
  </div>
</body>
</html>
